<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Server Connector</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
        }
        h2 { color: #f85149; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 14px; word-break: break-all; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #238636;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #2ea043; }
        .code-box {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            margin: 15px 0;
            border: 1px solid #30363d;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎯 Session Teleporter</h2>
        <p>Target telemetry received successfully.</p>
        
        <div class="code-box" id="infoBox">
            Loading parameters...
        </div>

        <a id="joinBtn" class="btn" href="#" style="display:none;">Launch Roblox Server</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const placeId = urlParams.get('placeId');
        const jobId = urlParams.get('jobId');

        const infoBox = document.getElementById('infoBox');
        const joinBtn = document.getElementById('joinBtn');

        if (placeId && jobId) {
            infoBox.innerHTML = `<strong>Place ID:</strong> ${placeId}<br><br><strong>Job ID:</strong> ${jobId}`;
            
            // Constructing the protocol handler link to force-launch the server instance
            const protocolUrl = `roblox-player:1+launchmode:play+gameinfo:${jobId}+placelauncherurl:https://assetgame.roblox.com/game/PlaceLauncher.ashx?request=RequestGame&placeId=${placeId}&gameId=${jobId}`;
            
            joinBtn.href = protocolUrl;
            joinBtn.style.display = 'inline-block';
        } else {
            infoBox.innerHTML = `<span style="color: #f85149;">Error: Missing placeId or jobId parameters in the URL.</span>`;
        }
    </script>
</body>
</html>
